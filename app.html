<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Würfelaugen zählen – Webcam</title>
  <style>
    body { font-family: system-ui; padding: 20px; }
    video, canvas { border:1px solid #ddd; border-radius:12px; }
    .row { display:flex; gap:20px; flex-wrap:wrap; }
    button { padding:8px 16px; margin-right:10px; }
  </style>
</head>
<body>

<h2>Würfelaugen zählen (Webcam Snapshot)</h2>

<div class="row">
  <video id="video" width="480" height="360" autoplay playsinline></video>
  <canvas id="canvas" width="480" height="360"></canvas>
</div>

<div style="margin-top:15px;">
  <button id="snap">Snapshot & Erkennen</button>
  <button id="reset">Reset</button>
  <span style="margin-left:20px;">Pips: <b id="count">-</b></span>
</div>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const snapBtn = document.getElementById("snap");
  const resetBtn = document.getElementById("reset");
  const countEl = document.getElementById("count");

  let stream;
  let cvReady = false;

  // Kamera starten
  async function startCamera() {
    stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
  }
  startCamera();

  // Warten bis OpenCV bereit ist
  function waitForCV() {
    return new Promise(resolve => {
      const check = () => {
        if (typeof cv !== "undefined" && cv.Mat) resolve();
        else setTimeout(check, 50);
      };
      check();
    });
  }
  waitForCV().then(() => cvReady = true);

  // Snapshot + Erkennung
  snapBtn.addEventListener("click", () => {
    if (!cvReady) return alert("OpenCV lädt noch...");

    // Frame ins Canvas zeichnen
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // ---- OpenCV Verarbeitung ----
    const src = cv.imread(canvas);
    const gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

    const blurred = new cv.Mat();
    cv.GaussianBlur(gray, blurred, new cv.Size(7,7), 0);

    const bin = new cv.Mat();
    cv.threshold(blurred, bin, 0, 255,
            cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

    const kernel = cv.getStructuringElement(
            cv.MORPH_ELLIPSE,
            new cv.Size(5,5)
    );
    const cleaned = new cv.Mat();
    cv.morphologyEx(bin, cleaned, cv.MORPH_OPEN, kernel);

    const contours = new cv.MatVector();
    const hierarchy = new cv.Mat();
    cv.findContours(
            cleaned,
            contours,
            hierarchy,
            cv.RETR_EXTERNAL,
            cv.CHAIN_APPROX_SIMPLE
    );

    let pipCount = 0;

    for (let i = 0; i < contours.size(); i++) {
      const cnt = contours.get(i);
      const area = cv.contourArea(cnt);

      if (area < 80 || area > 3000) continue;

      const peri = cv.arcLength(cnt, true);
      if (peri <= 0) continue;

      const circularity =
              (4 * Math.PI * area) / (peri * peri);

      if (circularity < 0.5) continue;

      const rect = cv.boundingRect(cnt);

      pipCount++;

      ctx.strokeStyle = "lime";
      ctx.lineWidth = 3;
      ctx.strokeRect(rect.x, rect.y, rect.width, rect.height);
    }

    countEl.textContent = pipCount;

    // Speicher freigeben
    src.delete();
    gray.delete();
    blurred.delete();
    bin.delete();
    cleaned.delete();
    contours.delete();
    hierarchy.delete();
  });

  // Reset
  resetBtn.addEventListener("click", () => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    countEl.textContent = "-";
  });
</script>

</body>
</html>
